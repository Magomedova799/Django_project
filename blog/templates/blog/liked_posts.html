{% extends 'base.html' %}
{% block content %}
<h2 style="margin-bottom: 25px; text-align: center;">Понравившиеся публикации</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;">
    {% for like in likes %}
        <div style="border: 1px solid #e5e7eb; border-radius: 24px; padding: 20px; background: #fff; height: 160px; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h3><a href="{% url 'post_detail' like.post.pk %}" style="color: #111827; text-decoration: none; font-weight: bold;">{{ like.post.title }}</a></h3>
                <p style="font-size: 13px; color: #6b7280; margin-top: 5px;">Автор: {{ like.post.author }}</p>
            </div>
            <div style="font-size: 12px; color: #9ca3af;">Понравилось: {{ like.created_at|date:"d.m.Y" }}</div>
        </div>
    {% empty %}
        <p style="color: #9ca3af; text-align: center; grid-column: 1/-1;">Вы ещё не ставили лайков.</p>
    {% endfor %}
</div>
{% endblock %}
