{% extends 'base.html' %}
{% block title %}Вход — Bloger{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 450px;
        margin: 50px auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .auth-header h2 {
        font-size: 24px;
        font-weight: bold;
        color: #111827;
        margin-bottom: 6px;
    }

    .auth-header p {
        font-size: 13px;
        color: #6b7280;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
        color: #4b5563;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
    }

    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
        color: #111827;
        box-sizing: border-box;
    }

    .form-group input:focus {
        border-color: #f59e0b;
    }

    .auth-btn {
        width: 100%;
        padding: 12px;
        font-weight: bold;
        margin-top: 10px;
        background: #111827;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
    }

    .auth-btn:hover {
        background: #1f2937;
    }

    .auth-footer {
        text-align: center;
        margin-top: 25px;
        font-size: 13px;
        color: #6b7280;
    }

    .auth-footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h2>Вход в аккаунт</h2>
        <p>Добро пожаловать обратно! Пожалуйста, авторизуйтесь.</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="email">Email адрес</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="auth-btn">Войти</button>
    </form>

    <div class="auth-footer">
        Ещё нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
